name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pine-tooling:
    name: Pine tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - name: Check committed artifacts and publication boundaries
        run: python tools/verify_publication.py
      - name: Rebuild all indicators
        run: |
          python tools/build_intraday.py
          python tools/build_lux_custom.py
          python tools/build_vsa_observer.py
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Reject deliberate VSA logic mutations
        run: python tools/check_vsa_v3_mutations.py
      - name: Check rebuilt artifacts
        run: python tools/verify_publication.py
