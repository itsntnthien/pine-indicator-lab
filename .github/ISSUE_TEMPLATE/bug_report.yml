name: Indicator bug
description: Report a reproducible Pine or reference-engine issue.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include reproduction steps and the exact error. Do not include credentials.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Script and chart context
      description: Script/build SHA, symbol/feed, timeframe, candle type and changed inputs.
    validations:
      required: true
